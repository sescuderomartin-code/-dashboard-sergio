<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard Patrimonio Sergio</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root{
  --bg:#f4f7f9;--card:#fff;--text:#092033;--muted:#5d7180;--line:#e2eaf0;
  --teal:#00796b;--teal2:#004a43;--rv:#006dff;--cf:#ff3b9b;--crypto:#ff7900;--mp:#ffd31f;--cash:#29b536;
  --gold:#ffd31f;--silver:#9b9b9b;--red:#ef1d1d;--green:#119b31;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--text)}
.wrap{max-width:1360px;margin:0 auto;padding:18px}
.hero{background:linear-gradient(135deg,var(--teal2),#003c36);color:#fff;border-radius:14px;padding:22px 28px;display:flex;justify-content:space-between;align-items:center;gap:20px;box-shadow:0 12px 30px #003c3630}
.brand{display:flex;align-items:center;gap:18px}.logo{width:68px;height:68px;border-radius:50%;background:conic-gradient(var(--cf) 0 25%,var(--rv) 25% 50%,#34b233 50% 75%,var(--mp) 75% 100%);box-shadow:inset 0 0 0 2px #ffffff22}.hero h1{font-size:44px;line-height:1;margin:0;letter-spacing:.5px}.hero p{margin:8px 0 0;font-size:19px;opacity:.88}
.totalBox{border:1px solid #ffffff99;border-radius:10px;padding:14px 24px;min-width:310px;text-align:center}.totalBox label{display:block;font-weight:800;font-size:17px;margin-bottom:8px}.totalInputWrap{display:flex;align-items:center;justify-content:center;gap:10px}.totalInput{width:180px;border:1px solid #ffffffcc;border-radius:8px;background:#ffffff10;color:#fff;font-weight:900;font-size:34px;text-align:right;padding:8px 10px}.totalInput:focus{outline:none;background:#ffffff1f;box-shadow:0 0 0 3px #ffffff35}.euro{font-size:28px;font-weight:900}.hint{font-size:13px;opacity:.85;margin-top:8px}
.grid{display:grid;gap:16px;margin-top:16px}.grid2{grid-template-columns:1.15fr .95fr}.cardsGrid{grid-template-columns:repeat(2,1fr)}
.card{background:var(--card);border:1px solid #dde6ec;border-radius:14px;padding:18px;box-shadow:0 8px 22px #1b2d3b10}.card h2{margin:0 0 14px;color:#064f48;font-size:22px}.split{display:grid;grid-template-columns:260px 1fr;gap:18px;align-items:center}.canvasBox{height:315px}.subCanvas{height:255px}
.row{display:grid;grid-template-columns:1fr 145px 85px;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff;margin:8px 0}.label{color:#fff;font-weight:900;padding:14px 16px}.val,.pct{font-weight:900;text-align:right;padding:14px 12px}.pct{font-weight:800}.rv{background:linear-gradient(90deg,var(--rv),#1684ff)}.cf{background:linear-gradient(90deg,var(--cf),#ff65b5)}.crypto{background:linear-gradient(90deg,var(--crypto),#ff9b00)}.mp{background:linear-gradient(90deg,var(--mp),#ffea58);color:#102033}.cash{background:linear-gradient(90deg,var(--cash),#6fcf5b)}.total{background:linear-gradient(90deg,var(--teal2),var(--teal));color:#fff}
.summaryItem{display:grid;grid-template-columns:58px 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:11px;margin:8px 0}.icon{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:24px;font-weight:900}.amount{text-align:right;font-weight:900}.amount small{display:block;font-weight:700;color:#17324b;margin-top:2px}
.sectionTitle{display:flex;justify-content:space-between;align-items:center;color:#fff;font-size:22px;font-weight:900;padding:13px 16px;border-radius:8px;margin:-2px -2px 16px}.sectionTitle.mp{color:#fff}.miniTable{width:100%;border-collapse:collapse;font-size:15px}.miniTable th,.miniTable td{border-bottom:1px solid var(--line);padding:10px;text-align:right;vertical-align:middle}.miniTable th:first-child,.miniTable td:first-child{text-align:left}.miniTable th{font-size:13px;color:#0d2238}.dot{display:inline-block;width:13px;height:13px;border-radius:50%;margin-right:8px;vertical-align:-1px}.pctInput{width:74px;border:1.5px solid #cdd9e2;border-radius:7px;background:#fff;padding:7px 8px;text-align:right;font-size:15px;font-weight:800;color:var(--text)}.pctInput:focus{outline:none;border-color:#0d8bff;box-shadow:0 0 0 3px #0d8bff22;background:#fffbd2}.pctCell{white-space:nowrap}.totalPctBadge{display:inline-block;min-width:86px;text-align:center;border-radius:7px;padding:8px 10px;font-weight:900;background:#effaf1;color:var(--green);border:1px solid #aee4b8}.totalPctBadge.bad{background:#fff1f1;color:var(--red);border-color:#ff9c9c}.warning{margin-top:14px;color:var(--red);font-weight:800;font-size:14px}.okMsg{margin-top:14px;color:#375166;font-size:14px}.footInfo{text-align:center;color:#456077;margin:14px 0 6px;font-size:14px}.toolbar{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}.btn{border:none;background:var(--teal);color:#fff;padding:10px 14px;border-radius:8px;font-weight:900;cursor:pointer}.btn.secondary{background:#10354b}
@media(max-width:1000px){.grid2,.cardsGrid{grid-template-columns:1fr}.hero{flex-direction:column;align-items:flex-start}.hero h1{font-size:34px}.split{grid-template-columns:1fr}.canvasBox{height:270px}.subCanvas{height:230px}.totalBox{width:100%}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="brand"><div class="logo"></div><div><h1>DASHBOARD PATRIMONIO</h1><p>Distribución global de activos y subcarteras</p></div></div>
    <div class="totalBox">
      <label>PATRIMONIO TOTAL</label>
      <div class="totalInputWrap"><input id="totalInput" class="totalInput" inputmode="numeric" /><span class="euro">€</span></div>
      <div class="hint">Haz clic en el valor para editar</div>
    </div>
  </header>

  <section class="grid grid2">
    <div class="card"><h2>DISTRIBUCIÓN GLOBAL</h2><div class="split"><div class="canvasBox"><canvas id="globalChart"></canvas></div><div id="globalRows"></div></div></div>
    <div class="card"><h2>RESUMEN GLOBAL</h2><div id="summaryRows"></div></div>
  </section>

  <section class="grid cardsGrid" id="cards"></section>
  <div class="toolbar"><button class="btn" onclick="saveData()">Guardar cambios</button><button class="btn secondary" onclick="resetData()">Restaurar datos</button></div>
  <p class="footInfo">Edita el patrimonio total y los porcentajes de cada subcartera. Los importes y gráficos se actualizan automáticamente.</p>
</div>
<script>
const euro=n=>new Intl.NumberFormat('es-ES',{maximumFractionDigits:0}).format(Number(n)||0)+' €';
const numFmt=n=>new Intl.NumberFormat('es-ES',{maximumFractionDigits:0}).format(Number(n)||0);
const pct=n=>new Intl.NumberFormat('es-ES',{maximumFractionDigits:0}).format(Number(n)||0)+' %';
const colors={rv:'#006dff',cf:'#ff3b9b',crypto:'#ff7900',mp:'#ffd31f',cash:'#29b536',acwi:'#0052b8',etf:'#0878ff',acciones:'#74a4f5',bondora:'#fff04d',debitum:'#ff3b9b',devon:'#f21d1d',esketit:'#20aeea',promo:'#20b91b',btc:'#ff7900',eth:'#ff8a1c',xrp:'#ffb000',sol:'#ffd229',bnb:'#fff04d',gold:'#ffd31f',silver:'#9b9b9b'};
const defaultData={
  patrimonio:150000,
  global:[['RENTA VARIABLE',50,'rv'],['CROWDFUNDING',25,'cf'],['CRIPTOMONEDAS',15,'crypto'],['MATERIAS PRIMAS',10,'mp'],['EFECTIVO',0,'cash']],
  cards:[
    {title:'RENTA VARIABLE',key:'rv',rows:[['ACWI',60,'acwi'],['ETFs',20,'etf'],['ACCIONES',20,'acciones']]},
    {title:'CROWDFUNDING',key:'cf',rows:[['BONDORA',20,'bondora'],['DEBITUM',20,'debitum'],['DEVON',20,'devon'],['ESKETIT',20,'esketit'],['PROMOCIONES',20,'promo']]},
    {title:'CRIPTOMONEDAS',key:'crypto',rows:[['BITCOIN',60,'btc'],['ETHEREUM',25,'eth'],['XRP',5,'xrp'],['SOLANA',5,'sol'],['BINANCE',5,'bnb']]},
    {title:'MATERIAS PRIMAS',key:'mp',rows:[['ORO',70,'gold'],['PLATA',35,'silver']]}
  ]
};
let data=JSON.parse(localStorage.getItem('sergioPatrimonioDash_v2')||'null')||structuredClone(defaultData);
let charts=[];
function parseNum(v){return Number(String(v).replace(/[^0-9,-]/g,'').replace(',','.'))||0}
function categoryAmount(key){let g=data.global.find(x=>x[2]===key);return data.patrimonio*((g?.[1]||0)/100)}
function globalRowsData(){return data.global.map(g=>[g[0],categoryAmount(g[2]),g[1],g[2]])}
function destroyCharts(){charts.forEach(c=>c.destroy());charts=[]}
function render(){destroyCharts();document.getElementById('totalInput').value=numFmt(data.patrimonio);
 const rows=globalRowsData();
 document.getElementById('globalRows').innerHTML=rows.map(r=>`<div class="row"><div class="label ${r[3]}">${r[0]}</div><div class="val">${euro(r[1])}</div><div class="pct">${pct(r[2])}</div></div>`).join('')+`<div class="row"><div class="label total">TOTAL</div><div class="val total">${euro(data.patrimonio)}</div><div class="pct total">100 %</div></div>`;
 document.getElementById('summaryRows').innerHTML=rows.map(r=>`<div class="summaryItem"><div class="icon" style="background:${colors[r[3]]};color:${r[3]==='mp'?'#fff':'#fff'}">${r[0]==='CRIPTOMONEDAS'?'₿':r[0]==='EFECTIVO'?'€':r[0]==='MATERIAS PRIMAS'?'Au':'↗'}</div><b>${r[0]}</b><div class="amount">${euro(r[1])}<small>${pct(r[2])}</small></div></div>`).join('')+`<div class="row"><div class="label total">TOTAL PATRIMONIO</div><div class="val total">${euro(data.patrimonio)}</div><div class="pct total">100 %</div></div>`;
 document.getElementById('cards').innerHTML=data.cards.map((c,ci)=>cardHtml(c,ci)).join('');
 charts.push(new Chart(document.getElementById('globalChart'),{type:'doughnut',data:{labels:rows.map(r=>r[0]),datasets:[{data:rows.map(r=>r[1]),backgroundColor:rows.map(r=>colors[r[3]]),borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:x=>`${x.label}: ${euro(x.raw)} (${pct(rows[x.dataIndex][2])})`}}},cutout:'55%'}}));
 data.cards.forEach((c,ci)=>{let base=categoryAmount(c.key);charts.push(new Chart(document.getElementById('chart'+ci),{type:'doughnut',data:{labels:c.rows.map(r=>r[0]),datasets:[{data:c.rows.map(r=>base*r[1]/100),backgroundColor:c.rows.map(r=>colors[r[2]]),borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:x=>`${x.label}: ${euro(x.raw)} (${pct(c.rows[x.dataIndex][1])})`}}},cutout:'55%'}}))});
}
function cardHtml(c,ci){let base=categoryAmount(c.key), gp=data.global.find(g=>g[2]===c.key)?.[1]||0, totalPct=c.rows.reduce((a,r)=>a+Number(r[1]||0),0), totalAmount=c.rows.reduce((a,r)=>a+base*r[1]/100,0), bad=totalPct>100;
 return `<div class="card"><div class="sectionTitle ${c.key}"><span>${c.title}</span><span>${euro(base)} | ${pct(gp)}</span></div><div class="split"><div class="subCanvas"><canvas id="chart${ci}"></canvas></div><table class="miniTable"><thead><tr><th>ACTIVO</th><th>IMPORTE</th><th>%</th></tr></thead><tbody>${c.rows.map((r,ri)=>`<tr><td><span class="dot" style="background:${colors[r[2]]}"></span>${r[0]}</td><td>${euro(base*r[1]/100)}</td><td class="pctCell"><input class="pctInput" type="number" step="1" value="${r[1]}" onchange="editPct(${ci},${ri},this.value)"> %</td></tr>`).join('')}<tr><td><b>TOTAL</b></td><td><b>${euro(totalAmount)}</b></td><td><span class="totalPctBadge ${bad?'bad':''}">${pct(totalPct)}</span></td></tr></tbody></table></div>${bad?`<div class="warning">⚠️ El total supera el 100 %. Revisa los porcentajes.</div>`:`<div class="okMsg">ⓘ La suma debe ser igual a 100 %.</div>`}</div>`}
function editPct(ci,ri,value){data.cards[ci].rows[ri][1]=parseNum(value);render()}
document.getElementById('totalInput').addEventListener('change',e=>{data.patrimonio=parseNum(e.target.value);render()});
document.getElementById('totalInput').addEventListener('blur',e=>{e.target.value=numFmt(data.patrimonio)});
function saveData(){localStorage.setItem('sergioPatrimonioDash_v2',JSON.stringify(data));alert('Cambios guardados correctamente.');}
function resetData(){localStorage.removeItem('sergioPatrimonioDash_v2');data=structuredClone(defaultData);render();}
render();
</script>
</body>
</html>
